global:
    seed: 42
    out_dir: "output"

trainer:
    max_epochs: 10
    accelerator: auto
    devices: auto
    precision: "16-mixed"
    default_root_dir: "output/"

model:
    teacher:
        name: "vit_b_16"
        num_classes: 10
        pretrained: true

    student:
        name: "resnet50"
        num_classes: 10
        pretrained: true
        lr: 3e-4
        weight_decay: 5e-2
        label_smoothing: 0.05
        scheduler: "onecycle"

data:
    data_dir: "input/imgs/train"
    csv_path: "input/driver_imgs_list.csv"
    batch_size: 128
    num_workers: 4
    pin_memory: True
    persistent_workers: True
    image_size: 224
    flip_p: 0.2
    test_split: 0.15
