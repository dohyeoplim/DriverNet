global:
    seed: 42
    out_dir: "output"

trainer:
    max_epochs: 30
    accelerator: auto
    devices: auto
    precision: "bf16-mixed"
    strategy: "auto"

model:
    name: "resnet101"
    num_classes: 10
    pretrained: true
    lr: 3e-4
    weight_decay: 1e-4
    scheduler: "onecycle"
    label_smoothing: 0.02
    consistency_loss_type: kd
    consistency_rampup_steps: 0.2
    final_consistency_weight: 1.0
    max_logit_norm: 6.0
    ema_decay: 0.997
    ema_warmup_steps: 200

data:
    original_data_dir: "input/original/train"
    processed_data_dir: "input/processed/train"
    processed_hard_data_dir: "input/processed_hard/train"
    csv_path: "input/driver_imgs_list.csv"
    batch_size: 96
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
    validation_split: 0.2

data_test:
    predict_dir: "input/original/test"
    batch_size: 64
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
