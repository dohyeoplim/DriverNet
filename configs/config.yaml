global:
    seed: 42
    out_dir: "output"

trainer:
    max_epochs: 10
    accelerator: auto
    devices: auto
    precision: "bf16-mixed"
    strategy: "auto"

model:
    teacher:
        name: "vit_vit_b_16"
        num_classes: 10
        pretrained: true
        lr: 2e-5
        weight_decay: 0.05
        scheduler: "onecycle"
        label_smoothing: 0.1
        temperature: 1.6
        cons_weight: 0.06
        cp_weight: 0.12
        max_logit_norm: 6

    student:
        name: "resnet101"
        num_classes: 10
        pretrained: true
        lr: 1e-4
        weight_decay: 1e-3
        scheduler: "onecycle"
        label_smoothing: 0.05
        temperature: 1.0
        cons_weight: 0.2
        cp_weight: 0.05
        max_logit_norm: null

    mean_teacher:
        name: "resnet101"
        num_classes: 10
        pretrained: true
        lr: 1e-4
        weight_decay: 1e-3
        scheduler: "onecycle"
        label_smoothing: 0.05
        temperature: 1.0
        cons_weight: 0.2
        cp_weight: 0.05
        max_logit_norm: null

data:
    original_data_dir: "input/original/train"
    processed_data_dir: "input/processed/train"
    processed_hard_data_dir: "input/processed_hard/train"
    csv_path: "input/driver_imgs_list.csv"
    batch_size: 96
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
    validation_split: 0.2

data_test:
    predict_dir: "input/original/test"
    batch_size: 64
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
