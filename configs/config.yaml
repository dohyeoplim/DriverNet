trainer:
    max_epochs: 50
    accelerator: auto
    devices: auto
    precision: "16-mixed"

model:
    teacher:
        name: "vit_b_16"
        num_classes: 10
        pretrained: true

data:
    data_dir: "./input/imgs/train"
    csv_path: "./input/driver_imgs_list.csv"
    batch_size: 128
    num_workers: 4
    pin_memory: True
    persistent_workers: True
    image_size: 224
    flip_p: 0.2
    test_split: 0.15
