global:
    seed: 42
    out_dir: "output"

trainer:
    max_epochs: 30
    accelerator: auto
    devices: auto
    precision: "32"
    strategy: "auto"

model:
    name: "resnet152_depthg"
    num_classes: 10
    pretrained: true
    lr: 3e-4
    weight_decay: 8e-4
    scheduler: "onecycle"
    label_smoothing: 0.0
    consistency_loss_type: "kd"
    max_logit_norm: 5.0
    ema_decay: 0.999
    ema_warmup_steps: 40
    consistency_rampup_steps: 40
    final_consistency_weight: 1.0

data:
    original_data_dir: "/teamspace/studios/dataset/input/original/train"
    depth_data_dir: "/teamspace/studios/dataset/input/processed_depth/train"
    csv_path: "/teamspace/studios/dataset/input/driver_imgs_list.csv"
    batch_size: 312
    num_workers: 11
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
    validation_split: 0.2
    num_folds: 0
    fold_index: 0

data_test:
    predict_dir: "/teamspace/studios/dataset/input/original/test"
    depth_data_dir: "/teamspace/studios/dataset/input/processed_depth/test"
    batch_size: 256
    num_workers: 11
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
