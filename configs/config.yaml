global:
    seed: 42
    out_dir: "output"

trainer:
    max_epochs: 30
    accelerator: auto
    devices: auto
    precision: "bf16-mixed"
    strategy: "auto"

model:
    name: "resnet50"
    num_classes: 10
    pretrained: true
    lr: 1e-5
    weight_decay: 0.1
    scheduler: "onecycle"
    label_smoothing: 0.15
    cons_weight: 0.0
    ce_x1_weight: 0.0
    max_logit_norm: null
    ema_decay: 0.999
    ema_warmup_steps: 200
    teacher_entropy_weight: 0.0
    student_error_weight: 0.0
    kd_temperature: 2.5
    kd_x1_weight: 1.0
    kd_x2_weight: 0.3

data:
    original_data_dir: "input/original/train"
    processed_data_dir: "input/processed/train"
    processed_hard_data_dir: "input/processed_hard/train"
    csv_path: "input/driver_imgs_list.csv"
    batch_size: 96
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
    validation_split: 0.2

data_test:
    predict_dir: "input/original/test"
    batch_size: 64
    num_workers: 8
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 2
    image_size: 224
    flip_p: 0
